[project]
name = "oto-photo-mcp"
version = "1.1.0"
description = "Connect oto.photo to ChatGPT, Claude, Codex and Claude Code and any AI agent through Cotlet.dev, a hosted MCP server. No oto.photo API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["oto.photo", "oto.photo api", "oto.photo mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/oto-photo-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=oto-photo"
Source = "https://github.com/cotlet-connect/oto-photo-mcp"

[project.scripts]
oto-photo-mcp = "oto_photo_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"oto_photo_agent.py" = "oto_photo_agent.py"

[tool.hatch.build.targets.sdist]
include = ["oto_photo_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
